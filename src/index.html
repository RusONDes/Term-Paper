<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest — учебный проект</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <a class="logo" href="#" aria-label="Pinterest, на главную">
        <svg class="logo-svg" aria-hidden="true" fill="#e60023" height="24" viewBox="0 0 24 24" width="24">
          <path d="M7.54 23.15q-.2-2.05.26-3.93L9 14.04a7 7 0 0 1-.35-2.07c0-1.68.81-2.88 2.09-2.88.88 0 1.53.62 1.53 1.8q0 .57-.23 1.28l-.52 1.72q-.15.5-.15.92c0 1.2.91 1.87 2.08 1.87 2.09 0 3.57-2.16 3.57-4.96 0-3.12-2.04-5.12-5.05-5.12-3.36 0-5.49 2.19-5.49 5.24 0 1.22.38 2.36 1.11 3.14-.24.41-.5.48-.88.48-1.2 0-2.34-1.69-2.34-4 0-4 3.2-7.17 7.68-7.17 4.7 0 7.66 3.29 7.66 7.33s-2.88 7.15-5.98 7.15a3.8 3.8 0 0 1-3.06-1.48l-.62 2.5a11 11 0 0 1-1.62 3.67A11.98 11.98 0 0 0 24 12a11.99 11.99 0 1 0-24 0 12 12 0 0 0 7.54 11.15" />
        </svg>
        Pinterest
      </a>

      <form class="search-form" role="search">
        <label class="visually-hidden" for="search">Поиск пинов</label>
        <input id="search" class="search" type="search" placeholder="Поиск...">
      </form>

      <div class="board-dropdown">
  <button id="selectBoardBtn" class="board-dropdown__btn">
    Выбрать доску <span>▼</span>
  </button>
  <ul id="boardDropdownList" class="board-dropdown__list hidden">
    <li class="board-dropdown__item">Доска 1</li>
    <li class="board-dropdown__item">Доска 2</li>
    <li class="board-dropdown__item">Доска 3</li>
  </ul>
</div>

    </header>

    <section id="pins" class="pins" aria-label="Лента публикаций"></section>

    <dialog id="boardModal">
      <div class="modal-content">
        <h3>Сохранить в доску</h3>
        <button class="close-modal" id="closeModal" type="button">✕</button>
        <div id="boardsList"><p class="empty">Пока досок нет</p></div>
        <div class="create-board">
          <input id="boardInput" placeholder="Название доски..." autofocus autocomplete="off">
          <button id="createBoard" type="button">Создать</button>
        </div>
      </div>
    </dialog>

    <dialog id="reportDialog">
      <form method="dialog">
        <div class="claim-header"><h2 class="claim-title">Жалоба на пин</h2></div>
        <div class="claim-scroll">
          <ul class="claim-list">
            <li class="claim-item"><input type="radio" id="spam" name="option"><label for="spam">Спам</label></li>
            <li class="claim-item"><input type="radio" id="nudity" name="option"><label for="nudity">Изображения обнаженного тела, порнография или содержимое сексуального характера</label></li>
            <li class="claim-item"><input type="radio" id="selfHarm" name="option"><label for="selfHarm">Членовредительство</label></li>
            <li class="claim-item"><input type="radio" id="misinformation" name="option"><label for="misinformation">Ложная информация</label></li>
            <li class="claim-item"><input type="radio" id="aggression" name="option"><label for="aggression">Агрессивные действия</label></li>
            <li class="claim-item"><input type="radio" id="dangerousGoods" name="option"><label for="dangerousGoods">Опасные товары</label></li>
            <li class="claim-item"><input type="radio" id="harassment" name="option"><label for="harassment">Преследование или критика</label></li>
            <li class="claim-item"><input type="radio" id="violence" name="option"><label for="violence">Сцены насилия или изображение лиц, причастных к насильственным действиям</label></li>
            <li class="claim-item"><input type="radio" id="privacy" name="option"><label for="privacy">Нарушение конфиденциальности</label></li>
            <li class="claim-item"><input type="radio" id="nonConsensual" name="option"><label for="nonConsensual">Интимные изображения, произведенные без согласия</label></li>
            <li class="claim-item"><input type="radio" id="intellectualProperty" name="option"><label for="intellectualProperty">Это моя интеллектуальная собственность</label></li>
          </ul>
        </div>
        <div class="claim-actions">
          <button type="reset" id="cancel">Отмена</button>
          <button type="submit" id="nextButton" disabled>Далее</button>
        </div>
      </form>
    </dialog>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
