<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest — учебный проект</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <a class="logo" href="#" aria-label="Pinterest, на главную">Pinterest</a>

      <form class="search-form" role="search">
        <label class="visually-hidden" for="search">Поиск пинов</label>
        <input id="search" class="search" type="search" placeholder="Поиск...">
      </form>

      <button>
        Выбрать доску <span>▼</span>
      </button>
    </header>

    <section id="pins" class="pins" aria-label="Лента публикаций"></section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
